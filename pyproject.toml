[project]
name = "earthtrend"
version = "0.1.0"
description = "EarthTrend Detective"
requires-python = ">=3.12"
dependencies = [
    "litestar",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "aiosqlite",
    "httpx",
    "tenacity",
    "structlog",
    "jinja2",
    "aiofiles",
    "pyjwt",
    "argon2-cffi",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["earthtrend"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv]
package = true
