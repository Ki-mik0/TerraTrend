[project]
name = "earthtrend"
version = "0.1.0"
description = "EarthTrend Detective"
requires-python = ">=3.12"
dependencies = [
    "litestar",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "alembic",
    "psycopg[binary]",
    "asyncpg",
    "redis",
    "httpx",
    "tenacity",
    "structlog",
    "jinja2",
    "aiofiles",
    "pyjwt",
    "argon2-cffi",
    "prometheus-client",
    "pillow",
    "numpy",
    "scipy",
    "statsmodels",
    "numba",
    "pyyaml",
    "Rbeast",
    "ruptures",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "aiosqlite", "hypothesis", "pytest-benchmark", "ruff", "mypy", "types-PyYAML"]
varsearch = [
    "sentence-transformers>=3.0",
    "torch",
    "datasets",
    "accelerate",
]
potential = [
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
]
docs = ["matplotlib"]
# scripts/earthdata_grids.py: NASA Earthdata login, HDF5 / HDF4 readers, polar grid projection
data = ["earthaccess>=0.15", "h5py>=3.11", "pyhdf>=0.11", "pyproj>=3.6"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "pytest-cov",
    "pytest-benchmark",
    "ruff",
    "mypy",
    "types-PyYAML",
]
docs = ["matplotlib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=earthtrend.api --cov-report=term-missing"
markers = [
    "slow: long Monte-Carlo checks (deselect with -m 'not slow')",
    "benchmark: performance targets of PLAN_ANALYTICS section 14",
]

[tool.coverage.run]
source = ["earthtrend.api"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["earthtrend"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv]
package = true
