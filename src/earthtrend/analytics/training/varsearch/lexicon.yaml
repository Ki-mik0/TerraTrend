# Training lexicon for the M3 query generator (stage A10).
#
# Hand-written synonyms per variable and language, split by register:
#   plain - how a pupil or a non-specialist would name it
#   sci   - how a scientist would name it
# Ukrainian entries may be "nominative|genitive"; templates that need the genitive
# ("тренд {gen}") only use entries that have it.
#
# `phenomena` are whole questions about a phenomenon, each with the set of variables that
# answer it. They are the "чи стає сухіше" kind of query and are never shown to the human test.
#
# This file is training data, not the catalog: catalog keywords go into BM25, this file goes
# only into generated queries. Keep them overlapping but not identical.
version: lexicon-v1
terms:
  air_temperature_2m:
    en:
      plain: [temperature, air temperature, how warm it is, outdoor temperature, warming, heat]
      sci: [2 m air temperature, near-surface air temperature, surface air temperature, T2M, screen-level temperature]
