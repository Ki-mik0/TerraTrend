name: API contract

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --extra dev

      - name: OpenAPI contract matches the API
        run: uv run python scripts/contract.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web

      - name: Generated TypeScript types match the contract
        run: npm run api:check
        working-directory: web

      - name: Frontend compiles against the contract
        run: npm run typecheck
        working-directory: web
