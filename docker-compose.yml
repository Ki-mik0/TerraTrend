services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_USER: earthtrend
      POSTGRES_PASSWORD: earthtrend
      POSTGRES_DB: earthtrend
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U earthtrend -d earthtrend"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  cache:
    image: redis:7.4.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      target: runtime
    env_file:
      - path: .env
        required: false
    environment:
      DB_URL: postgresql+asyncpg://earthtrend:earthtrend@db:5432/earthtrend
      REDIS_URL: redis://cache:6379/0
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./models:/models
      - ./catalog:/app/catalog:ro

  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    depends_on:
      api:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      API_URL: http://api:8000
      DB_URL: postgresql+asyncpg://earthtrend:earthtrend@db:5432/earthtrend
    command: ["pytest", "tests/integration", "-q", "-o", "addopts="]
